<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificar correo - SADO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5efff;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .contenedor {
            width: min(90%, 430px);
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .icono {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 25px;
        }

        #mensaje {
            line-height: 1.5;
            margin: 0;
        }

        .cargando {
            color: #777;
        }

        .exito {
            color: #26834a;
        }

        .error {
            color: #c0392b;
        }

        .volver {
            display: inline-block;
            margin-top: 22px;
            padding: 10px 18px;
            border-radius: 10px;
            background: #8e6bbd;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="icono" id="icono">✉️</div>

        <h1 id="titulo">Verificando correo...</h1>

        <p id="mensaje" class="cargando">
            Estamos procesando el cambio de correo electrónico.
        </p>

        <a
            id="volver"
            class="volver"
            href="#"
            style="display: none;"
        >
            Volver
        </a>

    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script>
        // =========================================================
        // CONFIGURACIÓN DE FIREBASE
        // =========================================================

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_PROJECT_ID.appspot.com",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();

        const titulo = document.getElementById("titulo");
        const mensaje = document.getElementById("mensaje");
        const icono = document.getElementById("icono");
        const volver = document.getElementById("volver");

        // =========================================================
        // PROCESAR EL ENLACE DE FIREBASE
        // =========================================================

        const params = new URLSearchParams(window.location.search);

        const mode = params.get("mode");
        const actionCode = params.get("oobCode");
        const continueUrl = params.get("continueUrl");

        // Si existe una URL de continuación, la usaremos
        // solamente después de completar correctamente la acción.
        if (continueUrl) {
            try {
                const url = new URL(continueUrl);

                // Permitimos únicamente una URL de la extensión
                // para volver a SADO.
                if (url.protocol === "chrome-extension:") {
                    volver.href = continueUrl;
                }
            } catch (error) {
                console.warn("continueUrl no válida.");
            }
        }

        // =========================================================
        // COMPROBAR QUE TENEMOS UN CÓDIGO
        // =========================================================

        if (!actionCode) {

            icono.textContent = "⚠️";

            titulo.textContent = "Enlace no válido";

            mensaje.textContent =
                "No se encontró el código de verificación. " +
                "Es posible que el enlace esté incompleto o haya sido abierto incorrectamente.";

            mensaje.className = "error";

        } else {

            // =====================================================
            // CAMBIO DE CORREO
            // =====================================================

            auth.applyActionCode(actionCode)

                .then(() => {

                    icono.textContent = "✅";

                    titulo.textContent =
                        "Correo actualizado correctamente";

                    mensaje.textContent =
                        "La verificación fue completada y tu nuevo correo electrónico ya fue actualizado en Firebase.";

                    mensaje.className = "exito";

                    // Si tenemos una URL segura para volver a SADO,
                    // mostramos el botón.
                    if (volver.href !== "#") {
                        volver.style.display = "inline-block";
                    }

                })

                .catch((error) => {

                    console.error("Error al procesar el código:", error);

                    icono.textContent = "❌";

                    titulo.textContent =
                        "No se pudo completar el cambio";

                    mensaje.className = "error";

                    if (error.code === "auth/expired-action-code") {

                        mensaje.textContent =
                            "Este enlace de verificación ya venció. " +
                            "Deberás solicitar nuevamente el cambio de correo desde SADO.";

                    } else if (error.code === "auth/invalid-action-code") {

                        mensaje.textContent =
                            "Este enlace ya fue utilizado o no es válido.";

                    } else {

                        mensaje.textContent =
                            "Ocurrió un problema al procesar el enlace. " +
                            "Podés volver a SADO e intentar nuevamente.";
                    }

                });
        }
    </script>

</body>
</html>
